services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k6lab-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - k6lab-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: k6lab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - k6lab-network

networks:
  k6lab-network:
    driver: bridge
